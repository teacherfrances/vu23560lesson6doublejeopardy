<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready, set, send: Double Jeopardy</title>
<style>
:root{
  --black:#141414; --bar:#1d1d1d; --addr:#3b3b3b; --mid:#555; --line:#9a9a9a; --pale:#ececec; --pale2:#f5f5f5;
  --or:#F5A20F; --or-tint:#FFF0D2; --or-deep:#8A5300; --red:#9b2c2c; --red-tint:#F7E7E7;
  --disp:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Avant Garde","Futura","Trebuchet MS",sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html{font-size:22px;height:100%}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:var(--body);color:var(--black);background:#fff;line-height:1.3;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--or);outline-offset:2px;box-shadow:0 0 0 7px var(--black)}
.disp{font-family:var(--disp);font-weight:700}

.top{position:relative;z-index:60;background:var(--bar);color:#fff;display:flex;align-items:center;gap:.3rem;padding:.25rem .4rem;flex:none}
.dots{display:flex;gap:.2rem;flex:none}
.dots i{display:block;width:.4rem;height:.4rem;border-radius:50%;background:#9a9a9a}
.dots i:first-child{background:var(--or)}
.addr{flex:1;min-width:0;background:var(--addr);border-radius:999px;padding:.2rem .7rem;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:#fff;color:#111;border:0;border-radius:4px;font-weight:700;font-size:.8rem;min-height:44px;min-width:44px;padding:0 .5rem;flex:none}
.load{flex:none;background:#fff;border-bottom:3px solid var(--black);display:flex;align-items:center;gap:.5rem;padding:.2rem .5rem;font-size:.75rem;font-weight:700}
.load .lb{flex:1;height:.6rem;border:2px solid var(--black);background:#fff;position:relative}
.load .lb i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#F5A20F 0 10px,#141414 10px 20px);transition:width .5s}

main{flex:1;overflow:auto;padding:.5rem .6rem 1rem;-webkit-overflow-scrolling:touch}
.wrap{max-width:1500px;margin:0 auto}
.muted{color:var(--mid)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.bb{border:3px solid var(--black);background:#fff;font-weight:700;min-height:2.1em;padding:.15em .8em;border-radius:4px}
.bb.go{background:var(--or)}
.bb.solid{background:var(--black);color:#fff}
.bb.sm{min-height:44px;font-size:.85em;padding:0 .6em}
.chip{border:3px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .9em;font-weight:700}
.chip.on{background:var(--black);color:var(--or)}
.sbar{display:flex;align-items:stretch;margin:.3em 0 .6em}
.sbar .blk{background:var(--or);font-family:var(--disp);font-weight:700;min-width:2em;display:flex;align-items:center;justify-content:center;font-size:1.1em;padding:0 .3em}
.sbar .ttl{flex:1;background:var(--or-tint);border:3px solid var(--black);border-left:0;padding:.3em .7em;font-family:var(--disp);font-weight:700}
.card{border:3px solid var(--black);border-bottom:8px solid var(--or);background:#fff;padding:.7em .9em;margin:.6em 0}
.hero{border:3px solid var(--black);border-bottom:10px solid var(--or);margin:.3em 0 .7em}
.hero .hbar{background:var(--bar);color:#fff;padding:.25em .6em;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .panel{background:var(--or-tint);border-left:12px solid var(--or);margin:.6em;padding:.6em .9em}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:.8em}
.big{font-family:var(--disp);font-weight:700;font-size:2em;line-height:1.1;margin:.15em 0}
.lbl{font-family:var(--disp);font-weight:700;margin:.6em 0 .3em}
.trow{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin:.3em 0}
.tin{font:inherit;border:3px solid var(--black);border-radius:4px;min-height:44px;padding:.1em .5em;flex:1 1 10em;min-width:0}
.tnum{background:var(--black);color:var(--or);font-weight:700;min-width:2em;min-height:44px;display:flex;align-items:center;justify-content:center}

/* board */
.boardwrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(7.5em,1fr));gap:.35em;min-width:38em}
.cat{color:#fff;font-family:var(--disp);font-weight:700;text-align:center;padding:.45em .3em;display:flex;align-items:center;justify-content:center;min-height:2.8em;border:3px solid var(--black);line-height:1.15}
.tile{border:3px solid var(--black);border-bottom-width:8px;background:#fff;font-family:var(--disp);font-weight:700;font-size:1.5em;min-height:1.75em;border-radius:4px}
.tile:hover{background:var(--or-tint)}
.tile.used{background:repeating-linear-gradient(45deg,#f1f1f1 0 8px,#dedede 8px 16px);color:#9a9a9a;font-size:1.1em}
.turn{margin:.4em 0 .2em;font-family:var(--disp);font-weight:700;display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.turn .who{background:var(--black);color:var(--or);padding:.1em .7em;border-radius:999px}
.scores{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.3em}
.sc{flex:1 1 14em;border:3px solid var(--black);border-bottom:6px solid var(--black);background:#fff;padding:.2em .5em;display:flex;flex-wrap:wrap;align-items:center;gap:.4em}
.sc .nm{flex:1 1 5em;min-width:0}
.sc.on{border-bottom-color:var(--or);background:var(--or-tint)}
.sc .nm{font-family:var(--disp);font-weight:700;overflow-wrap:anywhere}
.sc .pts{font-family:var(--mono);font-weight:700;font-size:1.5em}
.sc .row .bb{flex:none}
.step{display:inline-flex;flex-wrap:wrap;gap:.3em;align-items:center;margin-left:auto;font-weight:400;font-family:var(--body)}

/* clue */
.ov{position:fixed;inset:0;top:var(--tb,0px);background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:.6rem}
.clue{background:#fff;border:3px solid var(--black);border-bottom:12px solid var(--cc,#F5A20F);width:100%;max-width:1100px;padding:.7em .9em}
.chd{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.ctag{color:#fff;background:var(--cc,#F5A20F);font-family:var(--disp);font-weight:700;padding:.15em .7em;border:2px solid var(--black)}
.cval{font-family:var(--mono);font-weight:700;font-size:1.3em}
.dbl{background:var(--black);color:var(--or);font-family:var(--disp);font-weight:700;padding:.3em .8em;margin:.5em 0;text-align:center;font-size:1.2em;animation:pop .6s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;margin:.5em 0}
.tclock{font-family:var(--mono);font-weight:700;font-size:1.6em;min-width:3.2em;text-align:center;border:3px solid var(--black);padding:0 .3em}
.tclock.red{background:var(--red);color:#fff}
.tbar{flex:1 1 8em;height:.7em;border:2px solid var(--black)}
.tbar i{display:block;height:100%;background:var(--or)}
.tup{font-weight:700;color:var(--red)}
.qtext{font-family:var(--disp);font-weight:700;font-size:1.45em;line-height:1.2;margin:.5em 0;background:var(--ct,#FFF0D2);border-left:10px solid var(--cc,#F5A20F);padding:.4em .6em;overflow-wrap:anywhere}
.snip{border:3px solid var(--black);background:var(--pale2);margin:.4em 0}
.snip .sh{background:#e4e6eb;padding:.2em .6em;font-size:.85em;overflow-wrap:anywhere}
.snip .sb{padding:.4em .7em;white-space:pre-line;overflow-wrap:anywhere}
.quote{display:flex;gap:.6em;align-items:flex-start;margin:.4em 0}
.quote .who{background:var(--black);color:#fff;font-weight:700;padding:.2em .6em;border-radius:6px;flex:none}
.quote .bub{background:var(--pale2);border:3px solid var(--black);border-radius:14px;padding:.4em .8em;font-size:1.2em;font-weight:700;position:relative;overflow-wrap:anywhere}
.opt{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;border:3px solid var(--black);background:#fff;min-height:2.4em;padding:.3em .6em;margin:.4em 0;border-radius:4px;font-size:1.15em}
.opt .ol{flex:none;width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;background:var(--ct,#FFF0D2);border:2px solid var(--cc,#F5A20F);font-weight:700;border-radius:4px}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt .mk{margin-left:auto;font-weight:700;flex:none}
.opt.right{background:var(--black);color:#fff}
.opt.right .mk{color:var(--or)}
.opt.wrong{background:repeating-linear-gradient(45deg,#e8e8e8 0 8px,#cdcdcd 8px 16px)}
.opt.wrong .tx{text-decoration:line-through}
.opt.dim{opacity:.45}
.why{border:3px solid var(--black);background:var(--or-tint);padding:.4em .7em;margin:.4em 0}
.why b{display:block}
.award{border-top:3px dashed var(--line);margin-top:.5em;padding-top:.4em}
.arow{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin:.3em 0}
.arow .nm{flex:1 1 8em;font-weight:700;overflow-wrap:anywhere}
.arow .bb.gave{background:var(--or)}
.arow .bb.took{background:var(--red);color:#fff}
.panel2{background:#fff;border:3px solid var(--black);border-bottom:10px solid var(--or);width:100%;max-width:900px;padding:.7em .9em}
.notes p{margin:.3em 0}
.notes h3{font-family:var(--disp);margin:.7em 0 .2em}
.win{font-family:var(--disp);font-weight:700;font-size:2em;text-align:center;margin:.3em 0}
.burst{position:fixed;pointer-events:none;font-size:2rem;z-index:90;left:50%;top:40%;transition:transform 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s}
@media (max-width:600px){ html{font-size:18px} .dots{display:none} .qtext{font-size:1.25em} .lbl2{display:none} #bFull{display:none}
  .board{min-width:0;grid-template-columns:repeat(5,minmax(0,1fr));gap:.2em} .cat{font-size:.56em;padding:.3em .1em;overflow-wrap:break-word;word-break:normal;hyphens:manual} .tile{font-size:1.05em;min-height:2.6em;padding:0} .tile.used{font-size:.8em} }
@media (max-width:600px){ .tb{font-size:15px;padding:0 6px;min-width:44px} .addr{font-size:13px;padding:4px 8px} .top{gap:4px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

<div class="top">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="addr" id="addr">&#128274; vu23560 &rsaquo; jeopardy</div>

mistake. What does Nam say?", "opts": ["My bad.", "Happy days!", "Sweet as."], "why": "My bad = it's my mistake. Sorry.", "quote": {"who": "Nam", "line": "Oops! I sent it to the wrong person."}}, {"q": "What do you say to Bella?", "opts": ["Bummer.", "Happy days!", "Talk soon."], "why": "Bummer = that's bad luck.", "quote": {"who": "Bella", "line": "The printer isn't working again."}}, {"q": "What do you say to Jennie?", "opts": ["Happy days!", "Bummer.", "My bad."], "why": "Happy days! = great, I'm really happy about that.", "quote": {"who": "Jennie", "line": "Ms Tran got my email!"}}, {"q": "What does Alan mean?", "opts": ["We can't change it.", "The library is really great.", "Let's go there right now."], "why": "It is what it is = that's how it is. We can't change it.", "quote": {"who": "Alan", "line": "The library closes at 5 pm. It is what it is."}}, {"q": "Which one is a friendly closing for an email to your teacher?", "opts": ["Talk soon,", "Bummer,", "My bad,"], "why": "Talk soon, is friendly and polite. Keep Bummer and My bad for friends."}]}, {"name": "Student email names", "col": "#0F7D7D", "tint": "#DDF0F0", "ink": "#fff", "talk": false, "qs": [{"q": "Harbour Mail says Bin. What does your student email say?", "opts": ["Deleted Items", "Junk Email", "Drafts"], "why": "Bin → Deleted Items."}, {"q": "Where do you start a new email?", "opts": ["New mail", "Inbox", "Sent Items"], "why": "New email → New mail."}, {"q": "Where do you type what the email is about?", "opts": ["Add a subject", "Junk Email", "Sent Items"], "why": "Subject → Add a subject."}, {"q": "You don't want this new message. What do you click?", "opts": ["Discard", "Forward", "Reply all"], "why": "Discard deletes a new message."}, {"q": "Your teacher says: Sign in. What does it mean?", "opts": ["Log in.", "Log off.", "Send it."], "why": "Sign in = log in. Sign out = log out = log off."}]}, {"name": "The keyboard", "col": "#6A4C9C", "tint": "#ECE6F5", "ink": "#fff", "talk": true, "qs": [{"q": "How do you make @?", "opts": ["Shift and 2", "Caps Lock and 2", "Shift and a"], "why": "Hold down Shift and press 2."}, {"q": "How do you make _ (underscore)?", "opts": ["Shift and the dash key", "Shift and the full stop key", "Caps Lock and the dash key"], "why": "Hold down Shift and press the dash key."}, {"q": "Which key starts a new line?", "opts": ["Enter", "Backspace", "the space bar"], "why": "Enter: See you later, on one line. Your name on the next line."}, {"q": "Jiao says the keys. What do you type?", "opts": ["jiao.l@gmail.com", "jiao_l@gmail.com", "jiao.l2@gmail.com"], "why": "full stop = . (dot). Shift and 2 = @.", "quote": {"who": "Jiao", "line": "j, i, a, o, full stop, l, Shift and 2, gmail, full stop, com"}}, {"q": "Caps Lock is on. What is the problem?", "opts": ["Everything is in capitals.", "Nothing appears on the screen.", "The email sends straight away."], "why": "Caps Lock makes ALL CAPITALS. Press it again to turn it off."}]}, {"name": "Say it, ask it", "col": "#2F5FA8", "tint": "#E3EBF7", "ink": "#fff", "talk": true, "qs": [{"q": "Where is the strong part? message", "opts": ["MES·sage", "mes·SAGE", "Both parts are the same."], "why": "MES·sage. Say it louder and longer."}, {"q": "Where is the strong part? sign out", "opts": ["sign OUT", "SIGN out", "Both words are the same."], "why": "Two-word verbs: the second word is strong."}, {"q": "Where is the strong part? attach", "opts": ["at·TACH", "AT·tach", "Both parts are the same."], "why": "at·TACH."}, {"q": "Your email didn't arrive. What do you say first?", "opts": ["My email didn't arrive.", "Hello. How are you today?", "Can I have your password?"], "why": "Step 1: say the problem. Then say what you did. Then ask."}, {"q": "You are not sure. How do you check?", "opts": ["So I click Forward, then I type the address?", "OK. Catch you later. Talk soon, Hideko.", "My bad. I forgot my password again."], "why": "Say the steps back to check.", "quote": {"who": "Hideko", "line": "Click Forward. The     (function(k){
      var oi = ord[k], cls = "opt", mk = "";
      if(G.pick != null){ if(oi === 0){ cls += " right"; mk = "\u2713"; } else if(G.pick === oi){ cls += " wrong"; mk = "\u2717"; } else cls += " dim"; }
      box.appendChild(h("button", {cls:cls, onclick:function(){ if(G.pick != null) return; choose(oi); }}, [h("span", {cls:"ol"}, letters.charAt(k)), h("span", {cls:"tx"}, Q.opts[oi]), mk ? h("span", {cls:"mk"}, mk) : null]));
    })(k);
  }
  if(G.pick == null) box.appendChild(h("div", {cls:"row"}, h("button", {cls:"bb sm", onclick:function(){ choose(-1); }}, "Show the answer")));
  else {
    var lead = G.pick === 0 ? "Yes! That's right." : (G.pick === -1 ? "The answer is: " + Q.opts[0] : "Not this time. The answer is: " + Q.opts[0]);
    box.appendChild(h("div", {cls:"why"}, [h("b", null, lead), Q.why]));
    box.appendChild(awardPanel());
  }
  box.appendChild(h("div", {cls:"row", style:"margin-top:.6em;justify-content:flex-end"}, h("button", {cls:"bb " + (G.pick != null ? "go" : ""), onclick:backToBoard}, G.pick != null ? "Back to the board \u25B6" : "Close without answering")));
  closeOv();
  var ov = h("div", {cls:"ov"}, box);
  ovRoot.appendChild(ov);
}
function choose(oi){
  G.pick = oi;
  G.used[G.cur.id] = true;
  if(G.solo && oi !== -1){ G.soloDone++; if(oi === 0){ G.soloRight++; G.teams[0].score += curVal(); } }
  else if(G.solo && oi === -1) G.soloDone++;
  if(oi === 0) burst(["\u2705", "\u2B50", "\uD83C\uDF89"]);
  T.run = false; save(); renderClue();
}
function awardPanel(){
  var p = h("div", {cls:"award"});
  if(G.solo){ p.appendChild(h("div", {cls:"muted"}, G.pick === 0 ? "+" + curVal() + " points" : "No points this time.")); return p; }
  var v = curVal();
  p.appendChild(h("div", {cls:"muted"}, "Teacher: give or take " + v + " points."));
  G.teams.forEach(function(t, i){
    var a = G.awarded[i] || 0;
    p.appendChild(h("div", {cls:"arow"}, [h("span", {cls:"nm"}, t.name + " (" + t.score + ")"),
      h("button", {cls:"bb sm" + (a > 0 ? " gave" : ""), onclick:function(){ t.score += v; G.awarded[i] = (G.awarded[i] || 0) + 1; save(); renderClue(); }}, "+ " + v),
      h("button", {cls:"bb sm" + (a < 0 ? " took" : ""), onclick:function(){ t.score -= v; G.awarded[i] = (G.awarded[i] || 0) - 1; save(); renderClue(); }}, "\u2212 " + v)]));
  });
  return p;
}
function backToBoard(){
  stopTimer(); closeOv();
  if(G.pick != null && !G.solo) G.turn = (G.turn + 1) % G.teams.length;
  G.cur = null; G.pick = null;
  var n = usedCount(G.round);
  G.v = n === 25 ? "roundEnd" : "board";
  save(); render();
}

/* ---------- timer ---------- */
var actx = null;
function beep(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = 660; g.gain.value = 0.06; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5); o.stop(actx.currentTime + 0.5); }catch(e){} }
function startTick(){
  clearInterval(T.iv);
  T.iv = setInterval(function(){
    if(!T.run || T.total === 0) return;
    T.left = Math.max(0, T.left - 1);
    if(T.left === 0){ T.run = false; T.up = true; beep(); }
    paintTimer();
  }, 1000);
}
function stopTimer(){ clearInterval(T.iv); T.run = false; }
function timerBox(){
  var b = h("div", {cls:"timer", id:"timer"});
  if(T.total === 0){ b.appendChild(h("span", {cls:"muted"}, "\u23F1\uFE0F Timer is off.")); return b; }
  b.appendChild(h("span", {cls:"tclock", id:"tclock"}, String(T.left)));
  b.appendChild(h("span", {cls:"tbar"}, h("i", {id:"tfill", style:"width:" + (T.left / T.total * 100) + "%"})));
  b.appendChild(h("button", {cls:"bb sm", id:"tpause", onclick:function(){ T.run = !T.run; if(T.left === 0){ T.left = T.total; T.up = false; T.run = true; } paintTimer(); }}, T.run ? "\u23F8 Pause" : "\u25B6 Go"));
  b.appendChild(h("button", {cls:"bb sm", onclick:function(){ T.left = Math.max(0, T.left - 10); paintTimer(); }}, "\u221210"));
  b.appendChild(h("button", {cls:"bb sm", onclick:function(){ T.left = T.left + 10; if(T.left > T.total) T.total = T.left; T.up = false; paintTimer(); }}, "+10"));
  b.appendChild(h("button", {cls:"bb sm", onclick:function(){ T.left = T.total = G.timer || T.total; T.up = false; T.run = true; paintTimer(); }}, "\u21BB Restart"));
  b.appendChild(h("span", {cls:"tup", id:"tup"}, T.up ? "Time's up!" : ""));
  return b;
}
function paintTimer(){
  var c = document.getElementById("tclock"); if(!c) return;
  c.textContent = String(T.left); c.className = "tclock" + (T.left <= 5 ? " red" : "");
  var f = document.getElementById("tfill"); if(f) f.style.width = (T.total ? T.left / T.total * 100 : 0) + "%";
  var p = document.getElementById("tpause"); if(p) p.textContent = T.run ? "\u23F8 Pause" : "\u25B6 Go";
  var u = document.getElementById("tup"); if(u) u.textContent = T.up ? "Time's up! You can still answer." : "";
}
function openTimerPanel(){
  var back = G.cur ? renderClue : null;
  var p = h("div", {cls:"panel2"}, [h("div", {cls:"sbar"}, [h("div", {cls:"blk"}, "\u23F1"), h("div", {cls:"ttl"}, "Timer for each question")])]);
  var r = h("div", {cls:"row"});
  TIMES.forEach(function(s){ r.appendChild(h("button", {cls:"chip" + (G.timer === s ? " on" : ""), onclick:function(){ G.timer = s; save();
    if(G.cur && G.pick == null){ T.total = s; T.left = s; T.up = false; T.run = s > 0; }
    if(back) renderClue(); else { closeOv(); render(); } }}, tlabel(s))); });
  p.appendChild(r);
  p.appendChild(h("div", {cls:"row", style:"margin-top:.6em;justify-content:flex-end"}, h("button", {cls:"bb", onclick:function(){ if(back) renderClue(); else closeOv(); }}, "Close")));
  closeOv(); ovRoot.appendChild(h("div", {cls:"ov"}, p));
}
function openNotes(){
  var back = G.cur ? renderClue : null;
  var p = h("div", {cls:"panel2 notes"}, [h("div", {cls:"sbar"}, [h("div", {cls:"blk"}, "\uD83D\uDCDD"), h("div", {cls:"ttl"}, "Notes: key rules")])]);
  NOTES.forEach(function(n){ p.appendChild(h("h3", null, n.t)); n.lines.forEach(function(l){ p.appendChild(h("p", null, l)); }); });
  p.appendChild(h("div", {cls:"row", style:"margin-top:.6em;justify-content:flex-end"}, h("button", {cls:"bb go", onclick:function(){ if(back) renderClue(); else closeOv(); }}, "Close")));
  closeOv(); ovRoot.appendChild(h("div", {cls:"ov"}, p));
}

/* ---------- round end / end ---------- */
function niceList(a){ return a.length < 3 ? a.join(" and ") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
function ranking(){ return G.teams.map(function(t, i){ return {t:t, i:i}; }).sort(function(a, b){ return b.t.score - a.t.score; }); }
function renderRoundEnd(){
  var w = wrap;
  w.appendChild(h("div", {cls:"sbar"}, [h("div", {cls:"blk"}, "\u2705"), h("div", {cls:"ttl"}, G.round === 0 ? "Round 1 finished!" : "Double board finished!")]));
  w.appendChild(G.solo ? h("div", {cls:"card win"}, G.soloRight + " right out of " + G.soloDone) : scoreCards());
  w.appendChild(h("div", {cls:"row", style:"margin-top:.8em"}, G.round === 0 ?
    h("button", {cls:"bb go", style:"font-size:1.2em", onclick:function(){ G.round = 1; G.v = "board"; save(); render(); main.scrollTop = 0; }}, "Go to the Double board \u25B6") :
    h("button", {cls:"bb go", style:"font-size:1.2em", onclick:function(){ G.v = "end"; save(); render(); }}, "See the winner \uD83C\uDFC6")));
}
function renderEnd(){
  var w = wrap;
  w.appendChild(h("div", {cls:"sbar"}, [h("div", {cls:"blk"}, "\uD83C\uDFC6"), h("div", {cls:"ttl"}, "Final scores")]));
  if(G.solo){
    var pct = G.soloDone ? Math.round(G.soloRight / G.soloDone * 100) : 0;
    w.appendChild(h("div", {cls:"card center"}, [h("div", {cls:"win"}, G.soloRight + " right out of " + G.soloDone), h("div", {cls:"cval"}, G.teams[0].score + " points"),
      h("p", null, pct >= 80 ? "Excellent work! \uD83C\uDF89" : pct >= 60 ? "Great work! Look at the Notes and try again." : "Good try. Look at the Notes. Then play again.")]));
  } else {
    var rk = ranking(), top = rk[0].t.score, winners = rk.filter(function(x){ return x.t.score === top; });
    w.appendChild(h("div", {cls:"card center"}, h("div", {cls:"win"}, winners.length > 1 ? "\uD83E\uDD1D It's a tie: " + niceList(winners.map(function(x){ return x.t.name; })) + "!" : "\uD83C\uDFC6 " + winners[0].t.name + " wins!")));
    rk.forEach(function(x, n){ w.appendChild(h("div", {cls:"sc" + (x.t.score === top ? " on" : ""), style:"margin:.3em 0"}, [h("span", {cls:"nm"}, (n + 1) + ". " + x.t.name), h("div", {cls:"pts"}, String(x.t.score))])); });
    burst(["\uD83C\uDFC6", "\uD83C\uDF89", "\u2B50"]);
  }
  w.appendChild(h("div", {cls:"row", style:"margin-top:.8em"}, [h("button", {cls:"bb go", onclick:function(){ G.v = "setup"; startGame(); }}, G.solo ? "Play again" : "Play again (same teams)"), h("button", {cls:"bb", onclick:function(){ G.v = "setup"; save(); render(); }}, "New game")]));
}

function burst(list){
  if(REDUCED) return;
  for(var i = 0; i < 16; i++){ (function(i){ var s = h("span", {cls:"burst"}, list[i % list.length]); document.body.appendChild(s);
    var a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.style.transform = "translate(" + Math.round(Math.cos(a) * d) + "px," + Math.round(Math.sin(a) * d - 50) + "px)"; s.style.opacity = "0"; }); });
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1300); })(i); }
}

function render(){
  setTop(); wrap.innerHTML = "";
  if(G.v === "setup") renderSetup();
  else if(G.v === "roundEnd") renderRoundEnd();
  else if(G.v === "end") renderEnd();
  else renderBoard();
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && ovRoot.innerHTML){ if(G.cur && ovRoot.querySelector(".panel2")){ closeOv(); renderClue(); } else if(G.cur) backToBoard(); else closeOv(); } });
window.addEventListener("resize", function(){ try{ setTop(); }catch(e){} });
render();
})();
</script>
</body>
</html>
